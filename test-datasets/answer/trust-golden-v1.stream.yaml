based_on: KBV1-R-001
query: 任务 A 的截止日期是什么？
answerability: answerable
expected_facts:
  - type: date
    value: "2026-08-30"
    source: KBV1-F-01
required_evidence: [KBV1-F-01]
acceptable_answer_forms:
  - "2026-08-30"
  - "2026年8月30日"
  - "8月30日"
forbidden_claims: []
must_cite: true
citation_requirements:
  - 必须引用 DOC-01
  - 引用位置必须包含日期信息
judge_dimensions:
  factual_value:
    method: code
    rule: 答案必须包含"2026-08-30"或"8月30日"
  groundedness:
    method: code
    rule: 答案内容必须在上下文中找到
  citation_support:
    method: code
    rule: 引用文档必须是 DOC-01，引用位置必须包含该日期
  uncertainty_or_refusal:
    method: code
    rule: 不应拒答（因为有明确证据）

