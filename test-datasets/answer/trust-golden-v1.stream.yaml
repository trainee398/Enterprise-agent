# ============================================================
# A-002: 时效性与精确性
# ============================================================
case_id: KBV1-A-002
based_on: KBV1-R-002
query: 任务 A 现在完成了多少？
answerability: answerable
expected_facts:
  - type: percentage
    value: "60%"
    source: KBV1-F-02
  - type: timestamp
    value: "2026-08-28"
    source: KBV1-F-02
required_evidence: [KBV1-F-02]
acceptable_answer_forms:
  - "60%（截至2026-08-28）"
  - "根据08-28的数据，完成度为60%"
forbidden_claims:
  - '"目前完成度60%"（误导为实时）'
  - "实时完成度60%"
  - '"当前60%"（无时间限定）'
  - "大约60%"
  - "约六成"
must_cite: true
judge_dimensions:
  factual_value:
    method: code
    rule: |
      1. 答案必须包含"60%"
      2. 答案必须包含时间信息"08-28"或"2026-08-28"
      3. 不得包含"约"、"大约"等模糊词
  groundedness:
    method: code
    rule: 百分比和时间戳都必须在上下文中找到
  citation_support:
    method: code
    rule: 引用必须包含完成度和更新时间
  uncertainty_or_refusal:
    method: rubric
    rule: 不应误导为实时数据

