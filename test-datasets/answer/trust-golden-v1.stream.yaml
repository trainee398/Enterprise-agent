# ============================================================
# A-013: 多事实引用对齐
# ============================================================
case_id: KBV1-A-013
based_on: KBV1-R-014
query: 用一句话总结任务 A 当前风险，并给出依据
answerability: answerable
expected_facts:
  - KBV1-F-01  # 截止日期
  - KBV1-F-02  # 完成度
  - KBV1-F-03  # 未关闭 P1
  - KBV1-F-06  # 接口阻塞
required_evidence: [KBV1-F-01, KBV1-F-02, KBV1-F-03, KBV1-F-06]
acceptable_answer_forms:
  - 综合摘要，每个断言带引用
forbidden_claims:
  - 无引用的结论
  - 责任归因
  - 把旧值说成实时
must_cite: true
citation_requirements:
  - 每个关键断言都有对应引用
  - 不可用一个引用覆盖所有断言
judge_dimensions:
  factual_value:
    method: code + rubric
    rule: |
      1. 数字和日期必须准确
      2. 不得包含文档中不存在的事实
  groundedness:
    method: rubric
    rule: |
      检查每个关键断言：
      1. 截止日期断言 → 必须有 F-01 支持
      2. 完成度断言 → 必须有 F-02 支持
      3. P1 数量断言 → 必须有 F-03 支持
      4. 接口状态断言 → 必须有 F-06 支持
  citation_support:
    method: manual
    rule: |
      人工检查引用对齐：
      1. 每个事实断言有单独引用或明确标注
      2. 引用位置真的支撑对应断言
      3. 不是笼统地引用"所有文档"
  uncertainty_or_refusal:
    method: rubric
    rule: |
      检查是否有超出证据的推断：
      - 责任归因
      - 因果关系
      - 把旧值当实时

