# ============================================================
# LC-010: 处理中不应返回结果
# ============================================================
case_id: KBV1-LC-010
category: state
priority: P0
precondition: 文档正在处理中，尚未索引完成
operation: 对该文档提问
expected_behavior: |
  1. 明确说明文档正在处理中
  2. 不编造答案
  3. 建议等待处理完成
expected_state:
  query_result: processing | not_ready
observable_evidence:
  - 处理中提示
  - 不返回编造内容
forbidden_behavior:
  - 返回编造的答案
  - 使用部分处理的内容（可能不完整或错误）
  - 静默失败（不告知用户原因）
判定方式: code + manual
判定规则: |
  1. 答案不包含文档的实际内容
  2. 明确提示"处理中"或"不可用"
  3. 用户知道需要等待

