# ============================================================
# LC-004: 超限文件明确提示
# ============================================================
case_id: KBV1-LC-004
category: upload
priority: P0
precondition: 空知识库，已确认文件大小限制
operation: 上传 KBV1-DOC-ERR-03（超出限制）
expected_behavior: |
  1. 上传前或上传时明确提示超限
  2. 说明限制值
  3. 不消耗处理资源
