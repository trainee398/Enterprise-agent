# ============================================================
# LC-009: 删除文档后不可检索
# ============================================================
case_id: KBV1-LC-009
category: delete
priority: P0
precondition: KBV1-DOC-01 已上传、处理完成并可检索
operation: 删除该文档
expected_behavior: |
  1. 文档从列表中移除
  2. 索引中的 Chunk 也被清理
  3. 检索不再返回该文档内容
expected_state:
  document_status: deleted | not_found
observable_evidence:
  - 文档列表中不再出现
  - 检索该文档的关键词不返回结果
  - document_id 无效或标记为已删除
forbidden_behavior:
  - 幽灵数据（删除后仍能检索到）
  - 只删除了列表，索引未清理
  - 部分 Chunk 残留
判定方式: code
判定规则: |
  1. 文档列表中不存在该 document_id
  2. 检索该文档的特有关键词不返回结果
  3. Top-K 中不出现该文档的 Chunk

