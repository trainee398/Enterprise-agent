# ============================================================
# LC-011: 更新文档后索引同步
# ============================================================
case_id: KBV1-LC-011
category: update
priority: P1
precondition: KBV1-DOC-07-v1（旧版）已上传并可检索
operation: 上传 KBV1-DOC-07-v2（新版），内容不同
expected_behavior: |
  根据产品契约：
  - 若支持版本：旧版标记失效，新版生效
  - 若覆盖：旧内容不可检索，新内容可检索
  - 若并存：两版本共存，标识清晰
expected_state:
  根据产品定义
observable_evidence:
  - 检索新版内容能找到
  - 检索旧版特有内容的行为符合产品定义
  - 版本信息或更新时间
forbidden_behavior:
  - 旧版内容压过新版（若承诺新版优先）
  - 新旧内容混答
  - 旧版残留（若承诺覆盖）
判定方式: code
判定规则: |
  1. 检索新版特有关键词能找到新版
  2. 检索旧版特有关键词的行为符合产品定义
  3. 不出现新旧混答

---

# ============================================================
# LC-012: 并发上传不混淆
# ============================================================
case_id: KBV1-LC-012
category: upload
priority: P1
precondition: 空知识库
operation: 同时上传 KBV1-DOC-01 和 KBV1-DOC-02
expected_behavior: |
  1. 两份文档有独立的 document_id
  2. 处理状态互不干扰
  3. 检索能区分两份文档
expected_state:
  document_count: 2
  each_has_unique_id: true
observable_evidence:
  - 两个不同的 document_id
  - 两个独立的处理状态
  - 检索结果能分别引用
forbidden_behavior:
  - document_id 冲突
  - 一个成功另一个消失
  - 内容混淆
判定方式: code
判定规则: |
  1. document_id 数量为 2
  2. document_id 不相同
  3. 检索 DOC-01 特有内容不返回 DOC-02
  4. 检索 DOC-02 特有内容不返回 DOC-01
