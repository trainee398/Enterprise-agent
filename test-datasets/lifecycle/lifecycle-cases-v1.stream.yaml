# ============================================================
# LC-002: 空文件明确失败
# ============================================================
case_id: KBV1-LC-002
category: upload
priority: P0
precondition: 空知识库
operation: 上传 KBV1-DOC-ERR-01（空文件）
expected_behavior: |
  1. 明确显示失败
  2. 错误原因可理解
  3. 用户知道下一步（删除或重新上传）
expected_state:
  upload_status: failed
  error_code: exists
  error_message: 清晰说明原因
observable_evidence:
  - 错误提示
  - 失败状态
  - 重试或删除入口
forbidden_behavior:
  - 显示为成功
  - 半份可见文档
  - 无错误信息
判定方式: manual
判定规则: |
  1. 页面明确显示失败
  2. 错误信息可理解（不是技术栈错误）
  3. 用户能判断下一步做什么

