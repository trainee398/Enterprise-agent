# ============================================================
# LC-007: 刷新后状态不丢失
# ============================================================
case_id: KBV1-LC-007
category: state
priority: P0
precondition: 文档正在处理中
operation: 刷新页面
expected_behavior: |
  1. 返回后仍能看到正在处理的文档
  2. 状态继续更新
  3. 不显示假成功
expected_state:
  处理中则继续显示处理中
  完成则显示完成
observable_evidence:
  - document_id 或 upload_id 持久化
  - 状态正确
forbidden_behavior:
  - 刷新后文档消失
  - 状态重置为"未上传"
  - 显示假成功
判定方式: manual
判定规则: |
  1. 刷新前后 document_id 一致
  2. 状态不倒退
  3. 最终状态与实际处理结果一致

