# ============================================================
# LC-006: 处理失败可重试
# ============================================================
case_id: KBV1-LC-006
category: retry
priority: P0
precondition: 上传文件后人为触发处理失败（如网络中断）
operation: 重试处理
expected_behavior: |
  1. 明确显示失败状态
  2. 提供重试入口
  3. 重试后不产生重复索引
expected_state:
  initial_status: failed
  after_retry_status: completed
observable_evidence:
  - 重试按钮或入口
  - 重试后的 processing_job_id
  - 检索结果不重复
forbidden_behavior:
  - 无重试入口（用户只能删除后重新上传）
  - 重试产生重复 document_id
  - 旧的失败任务仍显示"处理中"
判定方式: manual
判定规则: |
  1. 失败后能找到重试入口
  2. 重试后成功
  3. 检索文档内容不重复

