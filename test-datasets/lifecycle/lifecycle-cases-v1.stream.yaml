# ============================================================
# LC-001: 基础上传成功
# ============================================================
case_id: KBV1-LC-001
category: upload
priority: P0
precondition: 空知识库
operation: 上传 KBV1-DOC-01（短文本）并等待完成
expected_behavior: |
  1. 上传状态从"上传中"变为"处理中"再到"完成"
  2. 状态时间线清晰可见
  3. 文档可检索
expected_state:
  upload_status: success
  processing_status: completed
  indexing_status: indexed
observable_evidence:
  - upload_id
  - document_id
  - processing_job_id
  - 状态时间线
  - 文档在检索结果中出现
forbidden_behavior:
  - 静默失败（显示成功但实际未索引）
  - 状态卡在"处理中"不更新
  - 刷新后状态丢失
判定方式: code
判定规则: |
  1. upload_id 和 document_id 存在
  2. 最终状态为"完成"或等价表达
  3. 能通过检索找到文档内容
  4. 状态时间线有完整的时间戳

