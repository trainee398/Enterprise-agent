# ============================================================
# LC-005: 重复上传行为明确
# ============================================================
case_id: KBV1-LC-005
category: update
priority: P0
precondition: KBV1-DOC-01 已上传并处理完成
operation: 再次上传同名文件 KBV1-DOC-01
expected_behavior: 按产品契约执行（覆盖、去重或并存）
expected_state:
  根据产品定义：
    - 覆盖：旧 document_id 失效，新 document_id 生效
    - 去重：提示已存在，不重复处理
    - 并存：生成新 document_id，两份共存
observable_evidence:
  - document_id 数量
  - 版本信息（如果支持）
  - 旧文档状态（如果覆盖）
forbidden_behavior:
  - 静默去重但未告知用户
  - 重复索引导致检索结果重复
  - 旧文档残留（若承诺覆盖）
判定方式: code + manual
判定规则: |
  1. 行为符合产品声称的语义
  2. document_id 数量符合预期
  3. 检索结果不会不明重复

