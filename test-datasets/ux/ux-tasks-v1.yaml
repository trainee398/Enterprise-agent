## 测试执行建议

### 理想测试对象
- 未参与设计和开发
- 熟悉企业办公软件（飞书、Notion、Google Docs 等）
- 对 AI 有基本认知，但不懂技术细节

### 测试环境
- 真实浏览器，不要用开发模式
- 不要预先告知操作步骤
- 准备录屏工具
- 鼓励"边做边说"（Think Aloud）

### 测试流程
1. 给出任务目标，不给操作步骤
2. 观察第一次点击和停顿
3. 记录困惑点和误操作
4. 询问"你现在在想什么"
5. 只在完全卡住时给提示
6. 记录提示内容（这就是产品缺失的信息）

