## 观察清单

### 首屏检查
- [ ] 主要下一步是否只有一个
- [ ] 次要操作是否视觉弱化
- [ ] 空状态是否解释"这里是什么"和"下一步做什么"

### 状态文案检查
- [ ] 上传中 vs 处理中 vs 完成 vs 失败是否区分
- [ ] 是否告诉用户"现在发生什么、还要等多久"
- [ ] 失败后是否说明原因和下一步

### 层级检查
- [ ] 高频操作是否在第一层
- [ ] 技术参数是否渐进式披露
- [ ] 错误恢复路径是否可见

### 语言检查
- [ ] 是否用用户目标（上传文档、提问、查看来源）
- [ ] 还是用内部实现（Embedding、向量维度、Rerank）
- [ ] 错误信息是否可行动（不是技术栈错误）

