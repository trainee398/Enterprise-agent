## 第一批 UX 任务（7 条核心任务）

```yaml
# ============================================================
# UX-001: 找到上传入口并上传
# ============================================================
case_id: KBV1-UX-001
priority: P0
task_goal: 在没有讲解的情况下找到上传入口并上传支持格式
starting_state:
  - 空知识库
  - 用户首次使用
  - 无预先培训
user_profile: 企业员工，会用常见 SaaS 产品
success_criteria:
  - 用户能判断第一步是什么
  - 能找到上传按钮或入口
  - 能判断可上传什么文件
  - 成功触发上传
observe:
  - first_click: 用户第一次点击哪里
  - hesitation: 在哪里停顿超过 5 秒
  - wrong_action: 是否点击了错误位置
  - need_for_explanation: 是否需要口头提示
  - time_to_first_upload: 从打开页面到触发上传的时间
evidence:
  - 截图：首屏状态
  - 录屏：操作路径
  - 笔记：用户口头反馈
expected_completion_time: 30 秒内
acceptable_hesitation: 扫描首屏 5-10 秒
blocking_issues:
  - 找不到上传入口
  - 误以为需要先"创建知识库"
  - 不知道支持什么格式
  - 上传按钮被技术参数挡住

判定标准:
  通过:
    - 30 秒内找到上传入口
    - 无需口头提示
    - 能判断文件要求
  失败:
    - 超过 1 分钟未找到入口
    - 需要口头解释"点这里"
    - 误操作后无法恢复

信息架构检查:
  - 首屏是否只有一个明确的主要下一步
  - 上传入口是否视觉突出
  - 格式/大小提示是否在入口附近
  - 是否过早暴露"Chunk 大小"、"Embedding 模型"等参数

---

# ============================================================
# UX-002: 判断文档是否已经可提问
# ============================================================
case_id: KBV1-UX-002
priority: P0
task_goal: 上传后判断文档是否已经可提问
starting_state:
  - 刚完成上传操作
  - 文档可能在处理中
user_profile: 企业员工，期望快速得到答案
success_criteria:
  - 用户能区分"上传成功"、"处理中"、"可用"、"失败"
  - 能判断现在是否可以提问
  - 知道需要等待还是已经就绪
observe:
  - status_understanding: 用户如何描述当前状态
  - premature_query: 是否在处理中就开始提问
  - refresh_behavior: 是否频繁刷新
  - wait_or_leave: 是否等待还是离开
evidence:
  - 截图：处理中状态
  - 截图：完成状态
  - 笔记：用户理解
expected_completion_time: 10 秒内理解状态
acceptable_hesitation: 首次理解状态文案需要 5-10 秒
blocking_issues:
  - 状态文案不清楚（如只显示图标）
  - '"上传成功"误导为"可以提问"'
  - 处理中无进度指示
  - 刷新后状态丢失

判定标准:
  通过:
    - 能正确说出当前状态
    - 不会在处理中就提问并期待答案
    - 知道什么时候可以提问
  失败:
    - 误以为上传成功就能提问
    - 不知道是否需要等待
    - 等待超过 1 分钟后放弃

信息架构检查:
  - 处理状态是否用清晰的文字说明
  - 是否告诉用户"现在发生什么、还要等多久"
  - 完成后是否有明确的"可以提问"指示
  - 失败后是否说明原因和下一步

---

# ============================================================
# UX-003: 对已完成文档提出问题
# ============================================================
case_id: KBV1-UX-003
priority: P0
task_goal: 对已完成文档提出一个问题
starting_state:
  - 文档已处理完成，显示"可用"
  - 用户首次提问
user_profile: 企业员工，想快速找到某个信息
success_criteria:
  - 能找到提问入口
  - 知道问题作用于哪个知识库/文档
  - 成功提交问题并看到答案
observe:
  - input_location: 是否快速找到输入框
  - scope_confusion: 是否困惑"问题会查询哪些文档"
  - first_query: 第一个问题是什么
  - query_refinement: 是否需要改写问题
evidence:
  - 截图：提问界面
  - 录屏：提问过程
  - 笔记：用户困惑点
expected_completion_time: 30 秒内
acceptable_hesitation: 思考问题内容 10-20 秒
blocking_issues:
  - 找不到输入框
  - 不知道问题会查询哪个范围
  - 提交后无反应
  - 答案加载过慢无提示

判定标准:
  通过:
    - 30 秒内找到提问入口
    - 理解查询范围
    - 成功看到答案
  失败:
    - 找不到输入框
    - 误以为在全局搜索
    - 提交后放弃等待

信息架构检查:
  - 提问入口是否在文档可用后自然出现
  - 是否明确当前查询范围（这个文档 vs 所有文档）
  - 输入框 placeholder 是否给出示例
  - 加载状态是否清晰

---

# ============================================================
# UX-004: 检查答案是否可信
# ============================================================
case_id: KBV1-UX-004
priority: P0
task_goal: 检查答案是否可信
starting_state:
  - 已提出问题并收到答案
  - 用户想验证答案来源
user_profile: 企业员工，对 AI 答案持谨慎态度
success_criteria:
  - 能找到引用
  - 理解引用含义
  - 能判断答案是否有依据
observe:
  - citation_visibility: 引用是否立即可见
  - citation_click: 是否尝试点击引用
  - source_verification: 是否尝试回到原文
  - trust_level: 用户如何评价答案可信度
evidence:
  - 截图：答案与引用
  - 录屏：查看引用过程
  - 笔记：用户信任度评价
expected_completion_time: 20 秒内
acceptable_hesitation: 寻找引用 5-10 秒
blocking_issues:
  - 看不到引用
  - 引用不可点击
  - 点击后无法回到原文
  - 引用位置不支撑答案

判定标准:
  通过:
    - 能快速找到引用
    - 引用可见性好
    - 能回跳到原文
  失败:
    - 找不到引用
    - 引用不可用
    - 引用误导（不支撑答案）

信息架构检查:
  - 引用是否在答案附近可见
  - 引用格式是否易懂（文件名、页码、段落）
  - 点击后是否能看到足够的原文上下文
  - 无引用时是否明确说明

---

# ============================================================
# UX-005: 处理失败后恢复
# ============================================================
case_id: KBV1-UX-005
priority: P0
task_goal: 处理失败后恢复
starting_state:
  - 上传文件后处理失败
  - 用户看到失败提示
user_profile: 企业员工，遇到错误希望自己解决
success_criteria:
  - 理解失败原因
  - 知道下一步（重试 vs 删除 vs 换文件）
  - 能执行恢复操作
observe:
  - error_understanding: 用户如何理解错误信息
  - recovery_path: 用户选择重试还是删除
  - need_for_help: 是否需要联系支持
evidence:
  - 截图：错误状态
  - 笔记：用户困惑点
  - 录屏：恢复过程
expected_completion_time: 1 分钟内
acceptable_hesitation: 理解错误信息 10-20 秒
blocking_issues:
  - 错误信息不可理解（技术栈错误）
  - 没有重试或删除入口
  - 不知道是否可以换文件重试
  - 失败文档无法删除

判定标准:
  通过:
    - 理解失败原因
    - 找到恢复路径
    - 成功恢复或决定下一步
  失败:
    - 完全不理解错误
    - 找不到删除或重试
    - 被迫刷新页面

信息架构检查:
  - 错误信息是否用用户语言（不是技术错误码）
  - 是否说明可能原因和建议操作
  - 重试/删除入口是否明显
  - 失败文档是否可以清理

---

# ============================================================
# UX-006: 多个文档选择正确范围
# ============================================================
case_id: KBV1-UX-006
priority: P1
task_goal: 面对多个文档选择正确范围
starting_state:
  - 已上传 3 份文档（项目 A、项目 B、通用规范）
  - 用户想查询项目 A 的信息
user_profile: 企业员工，管理多个项目文档
success_criteria:
  - 理解当前知识库/文档范围
  - 能选择查询范围（单个文档 vs 全部）
  - 查询结果符合选择的范围
observe:
  - scope_awareness: 是否理解查询范围
  - filter_usage: 是否使用过滤或选择
  - result_confusion: 是否困惑结果来自哪里
evidence:
  - 截图：多文档界面
  - 笔记：用户理解
  - 录屏：选择过程
expected_completion_time: 40 秒内
acceptable_hesitation: 寻找范围选择 10-20 秒
blocking_issues:
  - 不知道当前查询范围
  - 无法选择单个文档
  - 查询结果混乱
  - 无法判断答案来自哪个文档

判定标准:
  通过:
    - 理解当前范围
    - 能选择或过滤
    - 结果符合预期
  失败:
    - 不知道查询了什么
    - 无法控制范围
    - 答案混淆来源

信息架构检查:
  - 当前范围是否清晰指示
  - 文档列表是否易扫描（名称、状态、更新时间）
  - 是否支持范围选择
  - 答案引用是否明确来自哪个文档

---

# ============================================================
# UX-007: 观察高级设置（不应挡路）
# ============================================================
case_id: KBV1-UX-007
priority: P1
task_goal: 普通用户不需要理解技术参数就能完成主任务
starting_state:
  - 首次使用
  - 用户想上传文档并提问
user_profile: 企业员工，不懂 AI 技术细节
success_criteria:
  - 能完成核心任务（上传、提问、查看答案）
  - 不被技术参数困扰
  - 高级参数是渐进式披露的
observe:
  - technical_confusion: 是否被"Chunk"、"Embedding"等词困扰
  - parameter_avoidance: 是否刻意跳过参数
  - default_sufficiency: 默认配置是否足够
evidence:
  - 截图：首屏和设置界面
  - 笔记：用户困惑点
expected_completion_time: 完成主任务不应超过 3 分钟
acceptable_hesitation: 可跳过高级参数
blocking_issues:
  - 首屏就暴露"Chunk 大小"
  - 必须配置参数才能上传
  - 技术术语无解释
  - 默认配置不可用

判定标准:
  通过:
    - 不理解技术参数也能完成任务
    - 高级参数是折叠或隐藏的
    - 默认配置可用
  失败:
    - 被技术参数挡住
    - 不配置就无法使用
    - 误操作参数导致失败

信息架构检查:
  - 技术参数是否默认暴露
  - 参数是否有合理默认值
  - 是否有"基础模式"和"高级模式"
  - 参数解释是否用用户语言
```

