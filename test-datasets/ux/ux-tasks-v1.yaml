# UX 体验任务集

> 体验评审也采用可复现任务，不只写"感觉复杂"

## 测试目标

验证首次使用者在没有口头讲解的情况下能否完成核心任务，识别：
- 首屏主 CTA 是否清晰
- 状态文案是否易懂
- 下一步是否明确
- 是否过早暴露技术参数
- 错误恢复路径是否可行动

